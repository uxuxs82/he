<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const w = wrap.clientWidth || 600;
const h = 340;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 100);
camera.position.set(0, 0, 4);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const l1 = new THREE.DirectionalLight(0xffffff, 1.2); l1.position.set(5,5,5); scene.add(l1);
const l2 = new THREE.DirectionalLight(0xffffff, 0.4); l2.position.set(-5,-5,-5); scene.add(l2);

const loader = new THREE.TextureLoader();
// текстура яблока (зелёные яблоки)
const texture = loader.load('https://pics.freeartbackgrounds.com/midle/Green_Apples_Texture-1033.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const mat = new THREE.MeshStandardMaterial({
  map: texture,
  roughness: 0.45,
  metalness: 0.05
});

const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), mat);
scene.add(sphere);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

function onResize(){
  const nw = wrap.clientWidth;
  if(nw < 10) return;
  renderer.setSize(nw, h);
  camera.aspect = nw / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
setTimeout(onResize, 100);
</script>
