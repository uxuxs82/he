<script type="module">
import * as THREE from 'three';

const wrap = document.getElementById('canvas-wrap');
const w = wrap.clientWidth || 600;
const h = 340;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 100);
camera.position.set(0, 2, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const l1 = new THREE.DirectionalLight(0xffffff, 1.4); l1.position.set(5,5,5); scene.add(l1);
const l2 = new THREE.DirectionalLight(0xffffff, 0.5); l2.position.set(-5,-5,-5); scene.add(l2);

const loader = new THREE.TextureLoader();
const texture = loader.load('https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg');
texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
texture.repeat.set(3, 2);
texture.colorSpace = THREE.SRGBColorSpace;

const mat = new THREE.MeshStandardMaterial({
  map: texture,
  roughness: 0.35,
  metalness: 0.05
});

const ringGeo = new THREE.TorusGeometry(1.1, 0.38, 28, 80);
const rings = [];
const positions = [-3.2, 0, 3.2];
const axes = [new THREE.Vector3(1,0.3,0), new THREE.Vector3(0,1,0.2), new THREE.Vector3(0.4,0,1)];

positions.forEach((x, i) => {
  const mesh = new THREE.Mesh(ringGeo, mat.clone());
  mesh.position.set(x, 0, 0);
  mesh.rotation.order = 'ZXY';
  mesh.userData.axis = axes[i];
  mesh.userData.speed = 0.01 + i * 0.004;
  scene.add(mesh);
  rings.push(mesh);
});

scene.rotation.x = -0.25;

function animate() {
  requestAnimationFrame(animate);
  rings.forEach(r => {
    r.rotateOnWorldAxis(r.userData.axis, r.userData.speed);
  });
  renderer.render(scene, camera);
}
animate();

function onResize(){
  const nw = wrap.clientWidth;
  if(nw < 10) return;
  renderer.setSize(nw, h);
  camera.aspect = nw / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
setTimeout(onResize, 100);
</script>
