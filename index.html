<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const w = 600, h = 400;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 100);
camera.position.set(0, 0, 4);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(w, h);
renderer.setClearColor(0x000000, 0); // прозрачный фон
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enablePan = false;

// свет
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const l1 = new THREE.DirectionalLight(0xffffff, 1.2); l1.position.set(5,5,5); scene.add(l1);
const l2 = new THREE.DirectionalLight(0xffffff, 0.4); l2.position.set(-5,-5,-5); scene.add(l2);

// текстура яблока с Wikimedia (CORS разрешён)
const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');
const texture = loader.load('https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Red_Apple.jpg/640px-Red_Apple.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5, metalness: 0.05 });

// шар (яблоко) — уменьшен в 1.5 раза, сдвинут влево
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.2 / 1.5, 64, 64), mat);
sphere.position.x = -1.0;
scene.add(sphere);

function animate() {
  requestAnimationFrame(animate);
  sphere.rotation.x += 0.005;
  sphere.rotation.y += 0.008;
  sphere.rotation.z += 0.003;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

<script>
